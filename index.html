<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>License Terms — Revamped</title>
  <meta name="description" content="License terms — readable, accessible, all sections visible and stacked cleanly." />

  <style>
    :root{
      --bg:#07102a; --card:#0f1724; --muted:#9aa4b2; --accent:#6ee7b7; --accent-2:#60a5fa; --text:#e6eef8;
      --radius:12px; --max-width:1000px; --pad:20px; --gap:14px;
    }
    html{height:100%;background:linear-gradient(180deg,#07102a,#071b2f);}    body{min-height:100vh;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;color:var(--text);background:linear-gradient(180deg,#07102a,#071b2f);background-attachment:fixed;background-repeat:no-repeat;}
    .wrap{max-width:var(--max-width);margin:32px auto;padding:18px;}

    /* Header */
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#04263b;font-weight:700;font-size:20px;box-shadow:0 8px 30px rgba(2,6,23,0.5)}
    h1{margin:0;font-size:1.15rem}
    .subtitle{color:var(--muted);font-size:0.95rem}

    /* Layout */
    .layout{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
    @media (max-width:900px){ .layout{grid-template-columns:1fr} }

    /* Left panel */
    .panel{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:var(--radius);padding:18px;border:1px solid rgba(255,255,255,0.04)}
    .meta{color:var(--muted);font-size:0.95rem}
    .email-row{display:flex;gap:10px;margin-top:14px}
    .email-button{display:inline-flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:rgba(110,231,183,0.08);border:1px solid rgba(255,255,255,0.03);color:var(--text);font-weight:600}

    /* Main card list */
    .main{background:transparent}
    .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    input.search{padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text);min-width:260px}
    .pill{background:rgba(255,255,255,0.02);padding:6px 10px;border-radius:999px;color:var(--muted);border:1px solid rgba(255,255,255,0.03)}

    /* Revamped term card styling: all cards expanded and stacked - no overlap */
    .cards{display:flex;flex-direction:column;gap:12px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;padding:16px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 8px 30px rgba(2,6,23,0.35)}
    .card h3{margin:0 0 6px 0;font-size:1rem}
    .card .lead{color:var(--muted);font-size:0.92rem;margin-bottom:8px}
    .card p{margin:0 0 10px 0;color:#dbe9f8;line-height:1.5}
    .card ul{margin:6px 0 0 1.15rem;color:#dbe9f8}

    /* Print friendly */
    @media print{ body{background:#fff;color:#000} .wrap{margin:6mm} .card{box-shadow:none;border:none} }

    /* Subtle animations when hovering each card */
    .card:hover{transform:translateY(-6px);transition:transform .18s ease}

    /* Empty state */
    .empty{padding:24px;border-radius:12px;background:rgba(255,255,255,0.02);color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">LT</div>
        <div>
          <h1>License Terms</h1>
          <div class="subtitle">Seller Customer License Terms and Agreements</div>
        </div>
      </div>
      <div class="controls">
        <input class="search" id="searchInput" placeholder="Search terms..." aria-label="Search terms">
        <div class="pill" id="lastUpdated">Last updated: —</div>
        <button id="printBtn" title="Print" class="pill">Print</button>
        <button id="savePdfBtn" title="Save as PDF" class="pill">Save PDF</button>
      </div>
    </header>

    <div class="layout">
      <aside class="panel" aria-labelledby="panel-title">
        <div class="meta">Keep these terms visible to buyers. Use the copy button to quickly share the contact email below.</div>
        <div class="email-row">
          <a id="emailLink" class="email-button" href="#"> <span id="emailText">loading...</span></a>
        </div>
      </aside>

      <main class="main">
        <div id="accordion" class="cards" aria-live="polite">
          <!-- Cards injected here, all expanded by default -->
        </div>
        <div id="empty" class="empty" style="display:none">No matching sections found.</div>
      </main>
    </div>
  </div>

  <!-- html2pdf library for client-side PDF generation -->  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js" integrity="sha512-YcsIPb0bq3qkq3kq3kq3kq3kq3kq3kq3kq3kq3kq3kq3kq3kq3kq3kq3kq3kq3kq3kq3kq3kq3kq==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>  <script>    const SOURCE = 'terms.json';    const emailLink = document.getElementById('emailLink');    const emailText = document.getElementById('emailText');    const accordion = document.getElementById('accordion');    const lastUpdatedEl = document.getElementById('lastUpdated');    const searchInput = document.getElementById('searchInput');    const printBtn = document.getElementById('printBtn');    const savePdfBtn = document.getElementById('savePdfBtn');    function el(tag, props = {}, ...children){      const node = document.createElement(tag);      Object.entries(props).forEach(([k,v]) => {        if (k === 'class') node.className = v;        else if (k === 'html') node.innerHTML = v;        else node.setAttribute(k, v);      });      children.forEach(c => { if (typeof c === 'string') node.appendChild(document.createTextNode(c)); else if (c) node.appendChild(c); });      return node;    }    function renderSection(idx, sec){
      // Create a visible card element (article) matching the revamped UI
      const card = el('article', {'class':'card', 'data-index': idx});
      // Title
      card.appendChild(el('h3', {}, sec.title || `Section ${idx+1}`));
      if (sec.subtitle) card.appendChild(el('div', {'class':'lead'}, sec.subtitle));

      // Body
      if (Array.isArray(sec.body)){
        sec.body.forEach(p => card.appendChild(el('p', {}, p)));
      } else if (sec.body && sec.body.type === 'list' && Array.isArray(sec.body.items)){
        if (sec.body.intro) card.appendChild(el('p', {}, sec.body.intro));
        const ul = el('ul');
        sec.body.items.forEach(it => ul.appendChild(el('li', {}, it)));
        card.appendChild(ul);
      } else if (typeof sec.body === 'string'){
        card.appendChild(el('p', {}, sec.body));
      } else {
        card.appendChild(el('p', {}, 'No content.'));
      }

      return card;
    }    function renderTerms(data){      const h1 = document.querySelector('h1'); if (h1) h1.textContent = data.title || 'License Terms';      lastUpdatedEl.textContent = 'Last updated: ' + (data.lastUpdated || '—');      const email = data.contact && data.contact.email ? data.contact.email : '';      if (email){        emailLink.href = 'mailto:' + email;        emailText.textContent = email;      } else {        emailLink.href = '#';        emailText.textContent = 'contact';      }      accordion.innerHTML = '';      if (Array.isArray(data.sections)){        data.sections.forEach((s, i) => {          accordion.appendChild(renderSection(i, s));        });      } else {        accordion.appendChild(el('div', {}, 'No sections found in terms.json'));      }    }    fetch(SOURCE, {cache:'no-store'})      .then(resp => {        if (!resp.ok) throw new Error('Network response not ok');        return resp.json();      })      .then(json => renderTerms(json))      .catch(err => {        console.error('Initial fetch failed — fallback loader will try', err);      });

    // Robust loader: try local first, then GitHub raw
    (async function loadTerms(){
      const FALLBACK = 'https://raw.githubusercontent.com/bmbulahan/LTA.github.io/main/terms.json';
      emailText.textContent = 'loading...';
      accordion.innerHTML = '<div class="empty">Loading terms...</div>';
      try {
        const r = await fetch(SOURCE, {cache:'no-store'});
        if (!r.ok) throw new Error('Local fetch failed: ' + r.status);
        const json = await r.json();
        renderTerms(json);
        return;
      } catch (errLocal){
        console.warn('Local fetch failed, trying fallback...', errLocal);
      }
      try {
        const r2 = await fetch(FALLBACK, {cache:'no-store'});
        if (!r2.ok) throw new Error('Fallback fetch failed: ' + r2.status);
        const json2 = await r2.json();
        renderTerms(json2);
        return;
      } catch (errFallback){
        console.error('Fallback fetch failed', errFallback);
      }
      emailText.textContent = 'Could not load terms';
      accordion.innerHTML = '<div class="empty">Could not load terms.json. Run a local server or check network connection.</div>';
    })();

    searchInput.addEventListener('input', () => {      const q = searchInput.value.trim().toLowerCase();      const cards = Array.from(accordion.children);      let visible = 0;      cards.forEach(c => {        const text = (c.textContent||'').toLowerCase();        const match = !q || text.includes(q);        c.style.display = match ? 'block' : 'none';        if (match) visible++;      });      if (typeof emptyEl !== 'undefined') emptyEl.style.display = visible ? 'none' : '';    });    // Print button: opens browser print dialog
    printBtn.addEventListener('click', () => window.print());

    // Save as PDF: gather all cards and generate PDF
    savePdfBtn.addEventListener('click', () => {
      const cards = Array.from(accordion.children);
      if (!cards.length) return;
      const wrapper = document.createElement('div');
      wrapper.style.padding = '12mm'; wrapper.style.background = '#fff'; wrapper.style.color = '#000';
      cards.forEach(c => wrapper.appendChild(c.cloneNode(true)));
      try { html2pdf().from(wrapper).set({margin:[12,12,12,12],jsPDF:{unit:'mm',format:'a4'}}).save(); }
      catch(e){ console.error('PDF generation failed', e); window.print(); }
    });

    // Debug overlay (visible only when '?debug=1' in URL)
    if (location.search.includes('debug=1')){
      const dbg = document.createElement('div');
      dbg.style.position = 'fixed'; dbg.style.right = '12px'; dbg.style.bottom = '12px'; dbg.style.zIndex = 9999; dbg.style.padding = '8px 10px'; dbg.style.background = 'rgba(0,0,0,0.6)'; dbg.style.color = '#fff'; dbg.style.fontSize = '12px'; dbg.style.borderRadius = '8px'; dbg.style.backdropFilter = 'blur(6px)';
      const bg = getComputedStyle(document.body).background || getComputedStyle(document.documentElement).background;
      const count = document.getElementById('accordion') ? document.getElementById('accordion').children.length : 0;
      dbg.innerText = `bg: ${bg}\ncards: ${count}`;
      document.body.appendChild(dbg);
      console.log('Debug:', bg, 'cards:', count);
    }
  </script>
</body>
</html>
